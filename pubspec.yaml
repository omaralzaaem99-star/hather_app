name: hather_app
description: "Ø­Ø§Ø¶Ø± - Arabic services app authentication."
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  equatable: ^2.1.0
  uuid: ^4.6.0
  intl: ^0.20.2
  crypto: ^3.0.7
  supabase_flutter: ^2.16.0
  flutter_dotenv: 6.0.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^18.0.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#2F6F6A"
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/auth/
    - assets/images/app_icon.png
    - assets/images/home/
